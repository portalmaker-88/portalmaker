<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트 이름</title>
  <meta name="description" content="사이트 설명을 여기에 적어주세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+KR:wght@800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#top">LOGO</a>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <canvas class="hero-canvas" id="hero-cone" role="img" aria-label="작은 카드들이 나선을 그리며 모인 원뿔이 별똥별을 따라 날아가는 애니메이션"></canvas>
      <div class="container hero-copy">
        <p class="eyebrow">태그라인</p>
        <h1 class="sr-only">PORTALMAKER</h1>
        <div class="hero-brand" data-path-draw data-text="PORTALMAKER" data-from="#fff2d0" data-to="#c8463c" data-stroke="4"></div>
        <p class="lead">한두 문장으로 사이트를 소개하는 문구가 들어갑니다.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#buttons">주요 버튼</a>
          <a class="btn btn-ghost" href="#buttons">보조 버튼</a>
        </div>
      </div>
    </section>

    <section class="buttons" id="buttons" aria-label="버튼 목록">
      <div class="container">
        <ul class="button-grid">
          <li><a class="tile" href="#">버튼 01</a></li>
          <li><a class="tile" href="#">버튼 02</a></li>
          <li><a class="tile" href="#">버튼 03</a></li>
          <li><a class="tile" href="#">버튼 04</a></li>
          <li><a class="tile" href="#">버튼 05</a></li>
          <li><a class="tile" href="#">버튼 06</a></li>
          <li><a class="tile" href="#">버튼 07</a></li>
          <li><a class="tile" href="#">버튼 08</a></li>
          <li><a class="tile" href="#">버튼 09</a></li>
          <li><a class="tile" href="#">버튼 10</a></li>
          <li><a class="tile" href="#">버튼 11</a></li>
          <li><a class="tile" href="#">버튼 12</a></li>
        </ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> 사이트 이름. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js?v=dev"></script>
  <script src="js/cone.js?v=dev"></script>
  <script src="js/path-draw.js?v=dev"></script>
</body>
</html>
