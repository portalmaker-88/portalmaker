<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사이트 이름</title>
  <meta name="description" content="사이트 설명을 여기에 적어주세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+KR:wght@800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#top">LOGO</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav">
        <ul>
          <li><a href="#about">소개</a></li>
          <li><a href="#features">특징</a></li>
          <li><a href="#gallery">갤러리</a></li>
          <li><a href="#contact">문의</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <canvas class="hero-canvas" id="hero-cone" role="img" aria-label="작은 카드들이 나선을 그리며 모인 원뿔이 별똥별을 따라 날아가는 애니메이션"></canvas>
      <div class="container hero-copy">
        <p class="eyebrow">태그라인</p>
        <h1>메인 헤드라인이 들어갈 자리</h1>
        <p class="lead">한두 문장으로 사이트를 소개하는 문구가 들어갑니다.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#contact">주요 버튼</a>
          <a class="btn btn-ghost" href="#about">보조 버튼</a>
        </div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="container split">
        <div>
          <h2>소개</h2>
          <p>소개 문구가 들어갈 자리입니다. 레퍼런스가 정해지면 내용을 채워 넣으세요.</p>
        </div>
        <div class="placeholder-media" aria-hidden="true">이미지</div>
      </div>
    </section>

    <section class="section section-alt" id="features">
      <div class="container">
        <h2>특징</h2>
        <div class="grid grid-3">
          <article class="card"><h3>특징 1</h3><p>설명 텍스트</p></article>
          <article class="card"><h3>특징 2</h3><p>설명 텍스트</p></article>
          <article class="card"><h3>특징 3</h3><p>설명 텍스트</p></article>
        </div>
      </div>
    </section>

    <section class="section" id="gallery">
      <div class="container">
        <h2>갤러리</h2>
        <div class="grid grid-4">
          <div class="placeholder-media" aria-hidden="true">1</div>
          <div class="placeholder-media" aria-hidden="true">2</div>
          <div class="placeholder-media" aria-hidden="true">3</div>
          <div class="placeholder-media" aria-hidden="true">4</div>
        </div>
      </div>
    </section>

    <section class="section section-alt" id="contact">
      <div class="container narrow">
        <h2>문의</h2>
        <form class="contact-form" id="contact-form">
          <label>이름<input type="text" id="contact-name" name="name" autocomplete="name"></label>
          <label>이메일<input type="email" id="contact-email" name="email" autocomplete="email"></label>
          <label>메시지<textarea id="contact-message" name="message" rows="4"></textarea></label>
          <button class="btn btn-primary" type="submit">보내기</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> 사이트 이름. All rights reserved.</p>
      <ul class="footer-links">
        <li><a href="#">개인정보처리방침</a></li>
        <li><a href="#">이용약관</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cone.js"></script>
</body>
</html>
